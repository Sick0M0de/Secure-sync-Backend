[project]
name = "securesync-backend"
version = "0.1.0"
description = "A secure task management backend API"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg2-binary",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "passlib[bcrypt]",
    "python-jose[cryptography]",
    "python-multipart",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
